  RVH: null
  HCM: null
  ARVC: null
  DCM: null
  amyloidosis: null
  aortic_stenosis: null
  pulmonary_HTN: null
  HFpEF_risk: null
  mitral_regurgitation: null
  LA_enlargement: null
  RA_enlargement: null
  LV_strain_grade: null
  infiltrative_cardiomyopathy_strain: null
  # Ischaemia — non-acute
  old_MI: null
  early_repol_vs_STEMI: null
  QTc_prolongation: null
  hypokalaemia: null
  hypercalcaemia: null
  digitalis_effect: null
  hypothyroidism_pattern: null
  hypothermia_osborn_waves: null
  digoxin_effect_vs_toxicity: null
