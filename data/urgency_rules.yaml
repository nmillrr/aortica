# Aortica Worklist Prioritization — Urgency Rules
#
# This file configures how multi-task ECG findings map to urgency tiers
# for the AI-driven worklist prioritization module.
#
# Each condition maps to the confidence (0.0–1.0) that escalates an ECG to
# that tier, or to null to use the class's own validation-tuned operating
# point shipped with the model (the default). A fixed number overrides the
# operating point for that class.
#
# Only outputs the loaded model actually trained can escalate an ECG.
# Entries for untrained outputs (VT, Brugada, every risk score, ...) are
# inert today; they record the intended tier for when a model trains them.
#
# Urgency tiers and score bands:
#   critical: 80–100 — life-threatening, immediate review
#   high:     60–79  — dangerous, priority review
#   moderate: 40–59  — significant, timely follow-up
#   low:       0–39  — routine, no urgent findings

critical_conditions:
  # Life-threatening arrhythmias
  VT: null
  VF: null
  av_block_3rd: null
  CPVT: null
  # Acute coronary syndromes
  STEMI: null
  posterior_MI: null
  occlusive_NSTEMI: null
  # Metabolic emergencies
  hyperkalaemia: null
  hyperkalaemia_severity_grade: null
  # STEMI mimics — high urgency
  de_Winter_T_wave: null
  aVR_ST_elevation: null
  # Drug toxicity
  TCA_toxicity: null

high_conditions:
