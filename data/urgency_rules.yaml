  AF: null
  AFL: null
  WPW: null
  brugada_pattern: null
  short_QT_syndrome: null
  fascicular_VT: null
  av_block_2nd: null
  # STEMI mimics — high concern
  Wellens_syndrome: null
  Sgarbossa_criteria: null
  # Structural — acute
  Takotsubo_pattern: null
  RV_strain_PE: null
  LVSD: null
  myocarditis: null
  pericarditis: null

