# Reference training run for v0.4.0 — the model the whitepaper reports.
#
# Reproduce with:
#   python scripts/train_reference.py --config releases/v0.4.0/config.yaml
#
# Hyperparameters match the v0.3.0 model card (30 epochs, AdamW 1e-3, cosine
# decay with 5 warm-up epochs, batch 64, best epoch by masked validation
# loss). What v0.3.0 lacked was a recorded seed and split; both are fixed
# here and the split is written to splits.csv.
version: v0.4.0
seed: 42
torch_threads: 8

data:
  ptbxl: data/ptb-xl-a-large-publicly-available-electrocardiography-dataset-1.0.3
  chapman: data/a-large-scale-12-lead-electrocardiogram-database-for-arrhythmia-study-1.0.0

train:
  epochs: 30
  lr: 0.001
  batch_size: 64
  weight_decay: 0.0001
  warmup_epochs: 5
  max_grad_norm: 1.0
  sampling_rate: 100
  window_seconds: 10.0
  feature_dim: 240
  head_hidden_dim: 128
  head_dropout: 0.3
  save_metric: val_loss
  enabled_tasks: [rhythm, structural, ischaemia, risk]
